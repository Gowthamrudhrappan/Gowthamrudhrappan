<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Gowtham R — Design, Technology, AI</title>
<desc id="desc">A dark editorial hero graphic with dimensional wireframe geometry, floating glass-like panels, and green and gold accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b0a"/><stop offset=".55" stop-color="#101715"/><stop offset="1" stop-color="#050606"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6ffcb"/><stop offset=".55" stop-color="#2dd47a"/><stop offset="1" stop-color="#0b6d48"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".5" stop-color="#d6b85a"/><stop offset="1" stop-color="#816523"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".13"/><stop offset="1" stop-color="#ffffff" stop-opacity=".015"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8bbaa4" stroke-opacity=".13" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)"/>
<circle cx="930" cy="180" r="150" fill="#23d47b" opacity=".08" filter="url(#glow)"/>
<g transform="translate(850 205)">
