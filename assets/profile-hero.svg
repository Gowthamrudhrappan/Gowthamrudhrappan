  <circle cx="0" cy="0" r="20" fill="none" stroke="#f0d987" stroke-opacity=".65"/>
  <circle cx="162" cy="-64" r="5" fill="#e7cb72"/>
  <circle cx="-155" cy="70" r="4" fill="#8bffbe"/>
</g>
<g transform="translate(70 62)">
