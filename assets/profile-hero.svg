  <ellipse rx="158" ry="158" fill="none" stroke="#9ce8bd" stroke-opacity=".18" stroke-width="1" transform="rotate(18)"/>
  <path d="M0 -128 112 -64 112 64 0 128 -112 64 -112 -64Z" fill="url(#panel)" stroke="#8cf8b6" stroke-opacity=".65" stroke-width="1.5"/>
  <path d="M0 -128 0 0 112 64M0 0 -112 64M0 0 112 -64M0 0 -112 -64" fill="none" stroke="#b1ffcf" stroke-opacity=".55"/>
