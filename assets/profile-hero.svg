  <text x="3" y="215" fill="#a7b5ad" font-family="Arial,Helvetica,sans-serif" font-size="17">UI/UX Designer  ·  Creative Technologist  ·  AI Enthusiast</text>
  <g transform="translate(2 260)">
    <rect width="132" height="36" rx="18" fill="#d4b65e" fill-opacity=".13" stroke="#d4b65e" stroke-opacity=".7"/>
